name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail if a key pattern is committed
        run: npm run check:secrets
      - run: npm run typecheck
      - run: npm test
      - name: Validate every committed edition
        run: npx tsx scripts/validate-editions.ts
      - run: npm run build
