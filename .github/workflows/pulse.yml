name: Pulse
# Weekly: refresh the monthly public measurements in data/pulse.json. A change is committed,
# which redeploys the site. No secrets are used.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-pulse.mjs
      - name: Commit if the data changed
        run: |
          if [ -n "$(git status --porcelain data/pulse.json)" ]; then
            git config user.name "pulse-bot"
            git config user.email "pulse-bot@users.noreply.github.com"
            git add data/pulse.json
            git commit -m "Pulse: refresh monthly measurements"
            git push
          else
            echo "No change."
          fi
